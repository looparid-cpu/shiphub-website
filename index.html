<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Maemori Teahouse & Eatery</title>
  <meta name="theme-color" content="#8C5C38">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- ใช้ฟอนต์ Playfair Display สำหรับภาษาอังกฤษ และ Noto Sans Lao สำหรับภาษาลาว -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Noto Sans Lao', sans-serif;
      background-color: #4A3B32; 
    }

    .landing-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8vh 20px 6vh 20px;
      text-align: center;
      color: #FFFFFF;
      
      /* เปลี่ยนลิงก์รูปล่างนี้ เป็น url('bg.jpg') เมื่ออัปโหลดรูปพื้นหลังลง GitHub แล้ว */
      background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.4)), 
                 url('bg.jpg?v=1') center/cover no-repeat;

    }

    /* ส่วนบนสุด */
    .top-section h2 {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .top-section p {
      font-size: 0.65rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* ส่วนกลาง */
    .mid-section {
      margin-top: -12vh;
    }

    .mid-section h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .mid-section p {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }

    /* ส่วนล่าง */
    .bottom-section {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ปุ่มกด */
    .btn-outline {
      font-family: 'Playfair Display', serif;
      display: inline-block;
      width: 220px;
      padding: 10px 0;
      border: 1.5px solid #FFFFFF;
      border-radius: 50px;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 1.3rem;
      letter-spacing: 4px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(2px);
      margin-bottom: 25px;
    }

    .btn-outline:hover {
      background: #FFFFFF;
      color: #5A3D2B; /* เปลี่ยนเป็นสีน้ำตาลตอนเอาเมาส์ชี้ */
    }

    .bottom-section p {
      font-family: 'Noto Sans Lao', sans-serif;
      font-size: 0.9rem;
      line-height: 1.7;
      font-weight: 300;
      opacity: 0.95;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="landing-wrapper">
    <!-- Top Section -->
    <div class="top-section">
      <h2>Specialty Teahouse</h2>
      <p>Beverage &middot; Food &middot; Dessert</p>
    </div>

    <!-- Mid Section -->
    <div class="mid-section">
      <h1>Coming Soon</h1>
      <p>Teahouse &amp; Eatery</p>
    </div>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <!-- ลิงก์ไป Google Form -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfp5MoB0jVa-KI3iRgWErVHkaHHK7gB74DBDeuQY_P1u1XUmA/viewform" target="_blank" class="btn-outline">
        join our
      </a>
      <p>
        ມາຮ່ວມເປັນສ່ວນໜຶ່ງຂອງທີມພວກເຮົາ<br>
        ກົດປຸ່ມເພື່ອຝາກປະຫວັດໄດ້ເລີຍ
      </p>
    </div>
  </div>

</body>
</html>
